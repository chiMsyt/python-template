# Publish a GitHub Release when a version tag is pushed. Standard: Management/standards/ci-cd.md.
# Procedure (README "Release"): bump with `uv version --bump`, regenerate CHANGELOG.md with
# git-cliff, commit, then tag vX.Y.Z and push the tag. This workflow tests, builds, verifies,
# attests and publishes; it never builds from a cache.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {} # granted per job below

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release halfway through publishing

env:
  UV_VERSION: "0.12.6"
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign build provenance through Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history since the previous tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # a release is never built from a restored cache
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(uv version --short)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag $TAG does not match the package version $expected"
            exit 1
          fi
      - name: Tests
        run: uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uv run --group ci twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: uv run --isolated --no-project --with dist/*.whl python-template --version
      - name: Release notes for this tag
        run: uv run --group ci git-cliff --latest --strip all > notes.md
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }} # free on public repositories only
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
