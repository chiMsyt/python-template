# Continuous integration: portfolio CI/CD standard v1.0.0.
# Branch protection needs exactly one required check: "ci-ok".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * 1" # Mondays 01:30 UTC: new advisories and toolchain drift surface weekly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7" # pinned: uv audit is a preview feature and must not change under us
  UV_LOCKED: "1" # every uv sync and uv run must match uv.lock exactly

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Tests with branch coverage
        run: uv run pytest
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uv run --group ci twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: uv run --isolated --no-project --with dist/*.whl python-template --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Known vulnerabilities in locked dependencies (OSV)
        run: uv audit --preview-features audit-command

  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Workflow syntax (actionlint, with shellcheck on run blocks)
        run: uv run --group ci actionlint
      - name: Workflow security (zizmor)
        run: uv run --group ci zizmor --offline .github/workflows
      - name: Shell scripts
        run: uv run --group ci shellcheck .github/scripts/*.sh
      - name: Schemas
        run: |
          uv run --group ci check-jsonschema --schemafile .github/portfolio.schema.json portfolio.yml
          uv run --group ci check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          uv run --group ci check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
          uv run --group ci check-jsonschema --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml
          uv run --group ci check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
      - name: portfolio.yml id matches the repository
        run: bash .github/scripts/check-identity.sh

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [lint, test, build, audit, config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job finished with '$result'"
              exit 1
            fi
          done
