[project]
name = "python-template"
version = "0.1.0"
description = "Starting point for new Python projects: packaging, quality gates, CI/CD and benchmarks that already run."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
python-template = "python_template.cli:main"

[project.urls]
Repository = "https://github.com/chiMsyt/python-template"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle errors and warnings
    "F",      # pyflakes: unused and undefined names
    "I",      # import order
    "N",      # PEP 8 naming
    "UP",     # modern syntax for the minimum supported Python
    "B",      # bugbear: likely bugs
    "S",      # bandit: security smells
    "C4",     # comprehensions
    "SIM",    # simplifications
    "RET",    # return-statement consistency
    "PIE",    # miscellaneous lints
    "PT",     # pytest style
    "PTH",    # pathlib over os.path
    "ERA",    # commented-out code
    "T20",    # stray print() calls
    "RUF",    # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                   # assert is how pytest checks
"src/python_template/cli.py" = ["T201"] # a CLI prints by design

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--cov"]
strict = true

[tool.coverage.run]
source_pkgs = ["python_template"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
