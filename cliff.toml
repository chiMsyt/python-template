# git-cliff: CHANGELOG.md and release notes from Conventional Commits.
#   Changelog:     uv run --group ci git-cliff --tag vX.Y.Z -o CHANGELOG.md
#   Release notes: uv run --group ci git-cliff --latest --strip all

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). This file is generated by
git-cliff from commit messages: change the commits, not this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Dependencies and build" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = ".*", group = "<!-- 8 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
